<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="faq.page.title">FAQ — daomar.dev</title>
  <meta name="description" content="Questions and answers about daomar.dev, its products (AgentFleet, Lucky Draw), how this site keeps content fresh, and how AI assistants can cite us." />
  <meta name="robots" content="index, follow, max-snippet:-1" />
  <link rel="canonical" href="https://daomar.dev/faq.html" />
  <link rel="alternate" hreflang="en" href="https://daomar.dev/faq.html" />
  <link rel="alternate" hreflang="zh-CN" href="https://daomar.dev/faq.html?lang=zh" />
  <link rel="alternate" hreflang="x-default" href="https://daomar.dev/faq.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="daomar.dev" />
  <meta property="og:title" content="FAQ — daomar.dev" />
  <meta property="og:description" content="Answers about daomar.dev, AgentFleet, Lucky Draw, SEO/GEO, and how this site stays fresh." />
  <meta property="og:url" content="https://daomar.dev/faq.html" />
  <script type="application/ld+json" id="faq-schema"></script>
  <style>
    :root { --bg:#f7f3ec; --paper:#fffdf8; --ink:#17211f; --muted:#5d6b66; --line:#ded5c7; --accent:#9b4b25; --green:#2f6f5f; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; color:var(--ink); background:
      radial-gradient(circle at 88% 8%, rgba(155, 75, 37, 0.12), transparent 30%),
      radial-gradient(circle at 10% 84%, rgba(47, 111, 95, 0.12), transparent 26%),
      var(--bg);
      line-height:1.65; }
    .wrap { width:min(900px, calc(100% - 32px)); margin:0 auto; }
    header { padding:18px 0; border-bottom:1px solid rgba(222,213,199,0.65); background: rgba(247,243,236,0.82); backdrop-filter: blur(16px); position:sticky; top:0; z-index:5; }
    nav { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
    .brand { font-weight:800; letter-spacing:-0.03em; text-decoration:none; color:inherit; }
    .brand::before { content:"● "; color:var(--accent); }
    .nav-links { display:flex; align-items:center; flex-wrap:wrap; gap:14px; color:var(--muted); font-size:0.95rem; }
    .nav-links a { color:inherit; text-decoration:none; font-weight:600; }
    .nav-links a:hover { color:var(--accent); }
    .lang-toggle { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--paper); font-size:0.82rem; font-weight:700; }
    .lang-toggle button { appearance:none; border:0; background:transparent; color:var(--muted); padding:6px 12px; cursor:pointer; font:inherit; }
    .lang-toggle button[aria-pressed="true"] { background:var(--accent); color:#fffaf2; }
    main { padding:56px 0 70px; }
    h1 { font-size:clamp(2rem, 6.5vw, 4rem); line-height:1.08; letter-spacing:-0.05em; margin:0 0 16px; }
    .lede { color:var(--muted); margin:0 0 28px; font-size:1.08rem; max-width:680px; }
    .faq-list { display:grid; gap:12px; }
    details {
      border:1px solid var(--line); border-radius:18px; padding:16px 20px;
      background:rgba(255,253,248,0.85); transition: background 0.15s;
    }
    details[open] { background:var(--paper); box-shadow: 0 10px 30px rgba(23,33,31,0.05); }
    summary { cursor:pointer; font-weight:800; font-size:1.05rem; list-style:none; display:flex; justify-content:space-between; align-items:center; gap:12px; }
    summary::-webkit-details-marker { display:none; }
    summary::after { content:"+"; color:var(--accent); font-weight:700; font-size:1.4rem; line-height:1; transition: transform 0.2s; }
    details[open] summary::after { transform: rotate(45deg); }
    details p { color:var(--muted); margin:12px 0 0; }
    footer { padding:24px 0; border-top:1px solid var(--line); color:var(--muted); font-size:0.94rem; }
    footer a { color:var(--accent); font-weight:700; text-decoration:none; }
  </style>
</head>
<body>
  <header>
    <nav class="wrap" aria-label="Primary">
      <a class="brand" href="/">daomar.dev</a>
      <div class="nav-links">
        <a href="/#projects" data-i18n="nav.projects">Projects</a>
        <a href="/updates.html" data-i18n="nav.updates">Updates</a>
        <a href="/sources.html" data-i18n="nav.sources">Sources</a>
        <a href="https://github.com/daomar-dev" rel="noopener">GitHub</a>
        <span class="lang-toggle" role="group" aria-label="Language">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="zh" aria-pressed="false">中文</button>
        </span>
      </div>
    </nav>
  </header>

  <main class="wrap">
    <h1 data-i18n="faq.h1">Questions, answered.</h1>
    <p class="lede" data-i18n="faq.lede">Everything you might want to know about daomar.dev, its products, and how this site is kept fresh — for humans, search engines, and AI assistants.</p>
    <section class="faq-list" id="faq-list" aria-label="Frequently asked questions"></section>
  </main>

  <footer>
    <div class="wrap">
      © <span id="year">2026</span> daomar.dev ·
      <a href="/">Home</a> ·
      <a href="/updates.html" data-i18n="footer.updates">Updates</a> ·
      <a href="/sources.html" data-i18n="footer.sources">Sources</a> ·
      <a href="/llms.txt">llms.txt</a>
    </div>
  </footer>

  <script src="/i18n.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    function renderFAQ() {
      const list = document.getElementById('faq-list');
      const lang = window.daomarI18n.lang;
      const faqs = window.daomarI18n.faq;
      list.innerHTML = '';
      for (const item of faqs) {
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        const body = document.createElement('p');
        summary.textContent = item.q[lang];
        body.textContent = item.a[lang];
        details.append(summary, body);
        list.append(details);
      }
      // JSON-LD: emit the current-language version so AI engines pick it up clearly.
      document.querySelector('#faq-schema').textContent = JSON.stringify({
        '@context': 'https://schema.org',
        '@type': 'FAQPage',
        inLanguage: lang === 'zh' ? 'zh-CN' : 'en',
        mainEntity: faqs.map((item) => ({
          '@type': 'Question',
          name: item.q[lang],
          acceptedAnswer: { '@type': 'Answer', text: item.a[lang] }
        }))
      });
    }

    document.addEventListener('daomar:i18n', renderFAQ);
    renderFAQ();
  </script>
</body>
</html>
